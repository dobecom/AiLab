log_format ailab_access escape=json
    'time="$time_iso8601" request_id="$request_id" '
    'remote_addr="$remote_addr" forwarded_for="$http_x_forwarded_for" '
    'country="$http_cf_ipcountry" method="$request_method" host="$host" '
    'uri="$request_uri" protocol="$server_protocol" status=$status '
    'bytes=$body_bytes_sent request_time=$request_time '
    'referer="$http_referer" user_agent="$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    access_log /dev/stdout ailab_access;
    error_log /dev/stderr warn;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # No AiLab backend exists yet. Live Foundry features will be proxied to
    # Core-Server under /api/v1/ailab/ only when that module is published.
    location /api/ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
